<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limnoscope · Lake Eutrophication Intelligence</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#060f14;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.1);--tx:#e8f4f7;--mu:#8fb0ba;--a:#2dd4bf;--b:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#0e4a5a55,transparent),radial-gradient(900px 500px at -10% 10%,#14b8a633,transparent),var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;max-width:1200px;margin:auto}
.logo{font-weight:800;font-size:1.2rem;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.lang button{background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:6px 14px;cursor:pointer}
.lang button:first-child{border-radius:99px 0 0 99px}.lang button:last-child{border-radius:0 99px 99px 0}.lang .on{background:linear-gradient(90deg,var(--a),var(--b));color:#04222a;font-weight:700}
.hero{max-width:1200px;margin:auto;padding:30px 24px 10px}.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
.hero p{color:var(--mu);max-width:640px;margin:0}
main{max-width:1200px;margin:auto;padding:16px 24px 60px}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;backdrop-filter:blur(10px);min-width:0}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-top:20px}
label{font-size:.75rem;color:var(--mu);display:block;margin-bottom:4px}
input,textarea{width:100%;background:#0b1c24;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px;font:inherit}
button.go{background:linear-gradient(90deg,var(--a),var(--b));border:0;color:#04222a;font-weight:800;border-radius:10px;padding:11px 22px;cursor:pointer}
button.sec{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:.8rem}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;color:var(--mu);font-size:.8rem}
.grid{display:grid;gap:14px;margin-top:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi b{font-size:1.9rem;display:block}.kpi span{color:var(--mu);font-size:.8rem}
h2{font-size:1rem;margin:0 0 10px;color:var(--a)}
#map{height:380px;border-radius:12px}.ch{position:relative;height:280px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.83rem}th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu)}
.pill{padding:2px 9px;border-radius:99px;color:#fff;font-size:.72rem}
#st{color:var(--mu);margin-top:12px}.hide{display:none}
.note{font-size:.78rem;color:var(--mu);margin-top:18px}
@media(max-width:900px){.form{grid-template-columns:1fr 1fr}.form>:first-child{grid-column:1/-1}}
</style></head><body>
<nav><div class="logo">◉ Limnoscope</div><div class="lang"><button id="en" class="on">EN</button><button id="zh">中文</button></div></nav>
<section class="hero"><h1 data-i="h1"></h1><p data-i="sub"></p>
<div class="glass" style="margin-top:22px"><div class="form">
<div><label data-i="name"></label><input id="name" placeholder="Shanzai Reservoir / 山仔水库 / Lake Taihu"></div>
<div><label data-i="lat"></label><input id="lat" placeholder="26.3402"></div>
<div><label data-i="lon"></label><input id="lon" placeholder="119.3300"></div>
<div><label data-i="from"></label><input id="from" type="date"></div>
<div><label data-i="to"></label><input id="to" type="date"></div>
<button class="go" id="run" data-i="run"></button></div>
<div class="chips"><span data-i="presets"></span><button class="sec" data-y="1">1y</button><button class="sec" data-y="2">2y</button><button class="sec" data-y="5">5y</button><button class="sec" id="demo" data-i="demo"></button></div>
<div id="st"></div></div></section>
<main id="out" class="hide">
<div class="grid k4" id="kpi"></div>
<div class="grid g2"><div class="glass"><h2 data-i="map"></h2><div id="map"></div></div>
<div class="glass"><h2 data-i="cRisk"></h2><div class="ch"><canvas id="c1"></canvas></div></div></div>
<div class="grid g2"><div class="glass"><h2 data-i="cRain"></h2><div class="ch"><canvas id="c2"></canvas></div></div>
<div class="glass"><h2 data-i="cRad"></h2><div class="ch"><canvas id="c3"></canvas></div></div></div>
<div class="glass" style="margin-top:14px"><h2 data-i="season"></h2><div class="sc"><table id="tm"></table></div></div>
<div class="glass" style="margin-top:14px"><h2 data-i="wq"></h2><p class="note" data-i="wqh" style="margin:0 0 10px"></p>
<textarea id="csv" rows="5" placeholder="station,lat,lon,chl,tp,tn,sd,cod"></textarea>
<div class="chips"><input type="file" id="file" accept=".csv" style="width:auto"><button class="sec" id="tpl" data-i="tpl"></button><button class="go" id="calc" data-i="calc" style="padding:7px 18px"></button></div>
<div class="grid g2"><div class="ch"><canvas id="c4"></canvas></div><div class="sc"><table id="tt"></table></div></div></div>
<p class="note" data-i="disc"></p></main>
<script>
const T={en:{h1:'Read the health of any lake from space-grade climate data.',sub:'Enter a lake, river or reservoir name — or coordinates — and a time period. Get climate drivers, algal-bloom risk, seasonal phytoplankton succession and a TLI eutrophication assessment.',name:'Water body name',lat:'Latitude',lon:'Longitude',from:'From',to:'To',run:'Analyze',presets:'Quick range:',demo:'Demo: Shanzai',map:'Location & stations',cRisk:'Monthly temperature & bloom-risk index',cRain:'Monthly precipitation (nutrient pulse) & wind',cRad:'Daily bloom-risk index (14-day mean)',season:'Seasonal phytoplankton outlook',wq:'Water-quality data → TLI(Σ) eutrophication',wqh:'Paste or upload your measurements: station,lat,lon,chl(µg/L),tp(mg/L),tn(mg/L),sd(m),cod(mg/L). One row per station.',tpl:'Load template',calc:'Compute TLI',loading:'Fetching ERA5 climate data…',err:'Could not analyze: ',nf:'Place not found – try coordinates.',kT:'Mean air temp (°C)',kP:'Total precipitation (mm)',kD:'High-risk days (index ≥ 60)',kM:'Peak-risk month',mo:'Month',tm:'Temp °C',ri:'Risk',pr:'Rain mm',wi:'Wind m/s',ph:'Expected dominant group',d:'Diatoms / cryptophytes',g:'Green algae',c:'Cyanobacteria bloom window',st:'Station',cl:'State',cls:['Oligotrophic','Mesotrophic','Light eutrophic','Middle eutrophic','Hypereutrophic'],ok:'Analysis complete for ',disc:'Climate data: Open-Meteo/ERA5 reanalysis. Bloom-risk index and seasonal succession are model-based indicators (temperature, calm wind, solar radiation, 14-day rainfall), not measured chlorophyll. TLI uses your supplied measurements (China TLI-Σ method). Validate with field data.',risk:'Risk',rain:'Precip',tmp:'Temp'},
zh:{h1:'用气候数据读懂任意湖泊、水库的健康状况。',sub:'输入湖泊、河流或水库名称（或坐标）及时间段，即可获得气候驱动因子、藻华风险、浮游植物季节演替和 TLI 富营养化评价。',name:'水体名称',lat:'纬度',lon:'经度',from:'开始',to:'结束',run:'开始分析',presets:'快速选择：',demo:'示例：山仔水库',map:'位置与采样点',cRisk:'月均气温与藻华风险指数',cRain:'月降水量（营养盐脉冲）与风速',cRad:'日藻华风险指数（14天均值）',season:'浮游植物季节预测',wq:'水质数据 → TLI(Σ) 富营养化评价',wqh:'粘贴或上传实测数据：station,lat,lon,chl(µg/L),tp(mg/L),tn(mg/L),sd(m),cod(mg/L)，每个采样点一行。',tpl:'载入模板',calc:'计算 TLI',loading:'正在获取 ERA5 气候数据…',err:'分析失败：',nf:'未找到该地点，请输入坐标。',kT:'平均气温 (°C)',kP:'总降水量 (mm)',kD:'高风险天数（指数 ≥ 60）',kM:'风险峰值月份',mo:'月份',tm:'气温 °C',ri:'风险',pr:'降水 mm',wi:'风速 m/s',ph:'预期优势类群',d:'硅藻 / 隐藻',g:'绿藻',c:'蓝藻水华窗口',st:'站点',cl:'状态',cls:['贫营养','中营养','轻度富营养','中度富营养','重度富营养'],ok:'分析完成：',disc:'气候数据来自 Open-Meteo/ERA5 再分析。藻华风险指数和季节演替为基于气温、静风、太阳辐射和14天降雨的模型指标，并非叶绿素实测值。TLI 使用您提供的实测数据（中国 TLI-Σ 法）。请以现场监测验证。',risk:'风险',rain:'降水',tmp:'气温'}};
let L=localStorage.lang||'en',DATA=null,CH={},MAP,LY;
const $=id=>document.getElementById(id),t=k=>T[L][k];
function applyLang(){document.documentElement.lang=L;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('en').classList.toggle('on',L=='en');$('zh').classList.toggle('on',L=='zh');if(DATA)render()}
$('en').onclick=()=>{L='en';localStorage.lang=L;applyLang()};$('zh').onclick=()=>{L='zh';localStorage.lang=L;applyLang()};
const iso=d=>d.toISOString().slice(0,10);
function setYears(y){const e=new Date(Date.now()-6*864e5);$('to').value=iso(e);$('from').value=iso(new Date(e-y*365.25*864e5))}
document.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>setYears(+b.dataset.y));setYears(1);
$('demo').onclick=()=>{$('name').value='Shanzai Reservoir';$('lat').value=26.3402;$('lon').value=119.33;setYears(2);run()};
$('run').onclick=run;
async function run(){const q=new URLSearchParams({name:$('name').value,lat:$('lat').value,lon:$('lon').value,start:$('from').value,end:$('to').value});
 $('st').textContent=t('loading');
 try{const r=await fetch('/api/analyze?'+q),j=await r.json();if(!r.ok)throw new Error(j.error=='not_found'?t('nf'):(j.detail||j.error));DATA=j;$('st').textContent=t('ok')+j.place+' ('+j.start+' → '+j.end+')';$('out').classList.remove('hide');render();$('out').scrollIntoView({behavior:'smooth'})}
 catch(e){$('st').textContent=t('err')+e.message}}
const mean=a=>a.reduce((x,y)=>x+y,0)/(a.length||1),sum=a=>a.reduce((x,y)=>x+y,0);
function monthly(){const d=DATA.daily,g={};d.time.forEach((s,i)=>{const m=s.slice(0,7);(g[m]=g[m]||[]).push(i)});
 return Object.keys(g).map(m=>{const ix=g[m],f=k=>ix.map(i=>d[k][i]||0);return{m,t:mean(f('temp')),p:sum(f('precip')),w:mean(f('wind'))/3.6,r:mean(f('risk'))}})}
function mk(id,cfg){if(CH[id])CH[id].destroy();Chart.defaults.color='#8fb0ba';Chart.defaults.maintainAspectRatio=false;Chart.defaults.borderColor='rgba(255,255,255,.08)';CH[id]=new Chart(id,cfg)}
function render(){const d=DATA.daily,M=monthly(),hi=d.risk.filter(x=>x>=60).length,pk=M.reduce((a,b)=>b.r>a.r?b:a,M[0]);
 $('kpi').innerHTML=[[t('kT'),mean(d.temp).toFixed(1)],[t('kP'),sum(d.precip).toFixed(0)],[t('kD'),hi],[t('kM'),pk.m+' ('+pk.r.toFixed(0)+')']].map(k=>`<div class="glass kpi"><span>${k[0]}</span><b>${k[1]}</b></div>`).join('');
 if(!MAP){MAP=L_.map('map');L_.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Esri'}).addTo(MAP);LY=L_.layerGroup().addTo(MAP)}
 LY.clearLayers();L_.marker([DATA.lat,DATA.lon]).addTo(LY).bindPopup(DATA.place);STN.forEach(s=>s.m&&s.m.addTo(LY));MAP.setView([DATA.lat,DATA.lon],12);setTimeout(()=>MAP.invalidateSize(),200);
 const lb=M.map(x=>x.m);
 mk('c1',{data:{labels:lb,datasets:[{type:'bar',label:t('risk'),data:M.map(x=>+x.r.toFixed(1)),backgroundColor:M.map(x=>x.r>=60?'#ef4444':x.r>=40?'#f59e0b':'#2dd4bf'),yAxisID:'y'},{type:'line',label:t('tmp')+' °C',data:M.map(x=>+x.t.toFixed(1)),borderColor:'#38bdf8',yAxisID:'y1',tension:.3}]},options:{scales:{y:{min:0,max:100},y1:{position:'right',grid:{drawOnChartArea:false}}}}});
 mk('c2',{data:{labels:lb,datasets:[{type:'bar',label:t('rain')+' mm',data:M.map(x=>+x.p.toFixed(0)),backgroundColor:'#38bdf8aa'},{type:'line',label:'m/s',data:M.map(x=>+x.w.toFixed(1)),borderColor:'#a78bfa',yAxisID:'y1',tension:.3}]},options:{scales:{y1:{position:'right',grid:{drawOnChartArea:false}}}}});
 const sm=d.risk.map((_,i)=>mean(d.risk.slice(Math.max(0,i-13),i+1)));
 mk('c3',{type:'line',data:{labels:d.time,datasets:[{label:t('risk'),data:sm.map(x=>+x.toFixed(1)),borderColor:'#2dd4bf',backgroundColor:'#2dd4bf22',fill:true,pointRadius:0,tension:.3}]},options:{scales:{x:{ticks:{maxTicksLimit:8}},y:{min:0,max:100}}}});
 const ph=x=>x.t>=25&&x.r>=50?[t('c'),'#ef4444']:x.t>=15?[t('g'),'#84cc16']:[t('d'),'#c68b3c'];
 $('tm').innerHTML=`<tr><th>${t('mo')}</th><th>${t('tm')}</th><th>${t('pr')}</th><th>${t('wi')}</th><th>${t('ri')}</th><th>${t('ph')}</th></tr>`+M.map(x=>{const p=ph(x);return`<tr><td>${x.m}</td><td>${x.t.toFixed(1)}</td><td>${x.p.toFixed(0)}</td><td>${x.w.toFixed(1)}</td><td>${x.r.toFixed(0)}</td><td><span class="pill" style="background:${p[1]}">${p[0]}</span></td></tr>`}).join('');
 if(STN.length)tli()}
const L_=window.L;
// ---- TLI (China TLI-Σ) ----
let STN=[];const ln=Math.log,W=[.2663,.1879,.179,.1834,.1834];
const cl=x=>x<30?[0,'#2e86de']:x<50?[1,'#27ae60']:x<60?[2,'#d4a017']:x<70?[3,'#e67e22']:[4,'#c0392b'];
const TPL='station,lat,lon,chl,tp,tn,sd,cod\nS1,26.34017,119.32998,4,0.02,0.7,2.2,2.2\nS2,26.37278,119.30916,6,0.026,0.85,1.8,2.6\nS3,26.35898,119.28941,8,0.032,1.0,1.5,3.0\nS4,26.3989,119.28788,11,0.04,1.2,1.2,3.5\nS5,26.40473,119.28407,15,0.05,1.5,0.9,4.2';
$('tpl').onclick=()=>$('csv').value=TPL;
$('file').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(x=>$('csv').value=x)};
$('calc').onclick=()=>{STN=[];$('csv').value.trim().split(/\r?\n/).slice(1).forEach(r=>{const c=r.split(',');if(c.length<8)return;const [n,la,lo,chl,tp,tn,sd,cod]=[c[0],...c.slice(1).map(Number)];
 const v=[10*(2.5+1.086*ln(chl)),10*(9.436+1.624*ln(tp)),10*(5.453+1.694*ln(tn)),10*(5.118-1.94*ln(sd)),10*(.109+2.661*ln(cod))];const s=v.reduce((a,x,i)=>a+x*W[i],0),k=cl(s);
 STN.push({n,s,k,m:isFinite(la)&&isFinite(lo)?L_.circleMarker([la,lo],{radius:11,color:'#fff',fillColor:k[1],fillOpacity:.95}).bindTooltip(n+' · TLI '+s.toFixed(1),{permanent:true,direction:'right'}):null})});tli()};
function tli(){if(!STN.length)return;if(DATA){LY.clearLayers();L_.marker([DATA.lat,DATA.lon]).addTo(LY);const ps=[];STN.forEach(s=>{if(s.m){s.m.addTo(LY);ps.push(s.m.getLatLng())}});if(ps.length)MAP.fitBounds(ps,{padding:[40,40]})}
 mk('c4',{type:'bar',data:{labels:STN.map(s=>s.n),datasets:[{label:'TLI(Σ)',data:STN.map(s=>+s.s.toFixed(1)),backgroundColor:STN.map(s=>s.k[1])}]},options:{scales:{y:{min:20}}}});
 $('tt').innerHTML=`<tr><th>${t('st')}</th><th>TLI(Σ)</th><th>${t('cl')}</th></tr>`+STN.map(s=>`<tr><td>${s.n}</td><td>${s.s.toFixed(1)}</td><td><span class="pill" style="background:${s.k[1]}">${t('cls')[s.k[0]]}</span></td></tr>`).join('')}
applyLang();
</script></body></html>
