const t2ll=(x,y,z)=>{const n=2**z;return[Math.atan(Math.sinh(Math.PI*(1-2*y/n)))*180/Math.PI,x/n*360-180]};
async function waterAt(la,lo,z){const f=ll2t(la,lo,z),cx=Math.floor(f[0]),cy=Math.floor(f[1]),W=768,cv=document.createElement('canvas');cv.width=cv.height=W;const g=cv.getContext('2d',{willReadFrequently:true});
 await Promise.all([...Array(9)].map((_,k)=>new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{g.drawImage(im,(k%3)*256,Math.floor(k/3)*256);res()};im.onerror=res;im.src=`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${cy-1+Math.floor(k/3)}/${cx-1+k%3}`})));
 const d=g.getImageData(0,0,W,W).data,m=new Uint8Array(W*W);
 for(let i=0;i<W*W;i++){const r=d[i*4],gg=d[i*4+1],b=d[i*4+2],lu=.3*r+.59*gg+.11*b;m[i]=(b>=r+5&&b>=gg-12&&lu<150&&lu>5)?1:0}
 const I=new Int32Array((W+1)*(W+1));for(let y=0;y<W;y++){let row=0;for(let x=0;x<W;x++){row+=m[y*W+x];I[(y+1)*(W+1)+x+1]=I[y*(W+1)+x+1]+row}}
 const R=3,E=new Uint8Array(W*W);for(let y=R;y<W-R;y++)for(let x=R;x<W-R;x++){const s=I[(y+R+1)*(W+1)+x+R+1]-I[(y-R)*(W+1)+x+R+1]-I[(y+R+1)*(W+1)+x-R]+I[(y-R)*(W+1)+x-R];if(s==(2*R+1)**2)E[y*W+x]=1}
 const sx=Math.round((f[0]-(cx-1))*256),sy=Math.round((f[1]-(cy-1))*256);let st=-1,bd=1e9;
 for(let y=Math.max(0,sy-150);y<Math.min(W,sy+150);y++)for(let x=Math.max(0,sx-150);x<Math.min(W,sx+150);x++)if(E[y*W+x]){const q=(x-sx)**2+(y-sy)**2;if(q<bd){bd=q;st=y*W+x}}
 if(st<0)return null;const seen=new Uint8Array(W*W),Q=new Int32Array(W*W);let h=0,tl=0;Q[tl++]=st;seen[st]=1;const C=[];
 while(h<tl){const p=Q[h++],x=p%W,y=(p-x)/W;if(x%8==0&&y%8==0)C.push([x,y]);for(const n of[p-1,p+1,p-W,p+W])if(E[n]&&!seen[n]){seen[n]=1;Q[tl++]=n}}
 if(tl<600||C.length<5)return null;const P=farthest(C,0);return P.map(([x,y])=>t2ll(cx-1+x/256,cy-1+y/256,z))}
async function imgWater(la,lo){for(const z of[14,16,12]){try{const r=await waterAt(la,lo,z);if(r)return r}catch(e){}}return null}
const ring=(la,lo)=>Array.from({length:5},(_,i)=>{const a=i/5*2*Math.PI;return[la+.008*Math.sin(a),lo+.008*Math.cos(a)/Math.cos(la*Math.PI/180)]});
async function locate(la,lo,name){let p=await overpass(la,lo),pts=p&&placeInPoly(p);if(pts)return{poly:p,pts,src:'osm'};
 p=await nomPoly(name,la,lo);pts=p&&placeInPoly(p);if(pts)return{poly:p,pts,src:'osm'};
 pts=await imgWater(la,lo);if(pts)return{poly:null,pts,src:'img'};return{poly:null,pts:ring(la,lo),src:'ring'}}
/* ---------- data ---------- */
async function run(){const q=new URLSearchParams({name:$('name').value,lat:$('lat').value,lon:$('lon').value,start:$('from').value,end:$('to').value});
 $('st').textContent=t('l1');
 try{const r=await fetch('/api/analyze?'+q),j=await r.json();if(!r.ok)throw new Error(j.error=='not_found'?t('nf'):(j.detail||j.error));
 DATA=j;$('st').textContent=t('l2');LOC=await locate(j.lat,j.lon,$('name').value);POLY=LOC.poly;$('st').textContent=t('l3');MEAS=false;buildModel();
 $('st').textContent=t('ok')+j.place+' ('+j.start+' → '+j.end+')';$('out').classList.remove('hide');render();$('out').scrollIntoView({behavior:'smooth'})}
 catch(e){$('st').textContent=t('err')+e.message}}
function monthly(){const d=DATA.daily,g={};d.time.forEach((s,i)=>{const m=s.slice(0,7);(g[m]=g[m]||[]).push(i)});
 return Object.keys(g).map(m=>{const ix=g[m],f=k=>ix.map(i=>d[k][i]||0);return{m,t:mean(f('temp')),p:sum(f('precip')),w:mean(f('wind'))/3.6,r:mean(f('risk'))}})}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildModel(){const M=monthly(),r=Math.max(5,mean(M.map(x=>x.r))),mp=Math.max(1,mean(M.map(x=>x.p))),R=rng(Math.round(DATA.lat*1e4)^Math.round(DATA.lon*1e4));
 TW=mean(M.map(x=>x.t).sort((a,b)=>b-a).slice(0,3));
 const B={chl:2+r*.22,tp:.015+r*.0006,tn:.5+r*.014,sd:3-r*.03,cod:1.8+r*.05};
 let sel=M;if(M.length>12){sel=[];for(let i=0;i<12;i++)sel.push(M[Math.round(i*(M.length-1)/11)])}
 const pts=LOC.pts;
 STN=pts.map((p,i)=>{const g=.75+.14*i;return{n:'S'+(i+1),la:p[0],lo:p[1],ser:sel.map(mm=>{const s=Math.pow(Math.max(.25,mm.r/r),1.1),j=()=>.9+.2*R();
  return{lab:mm.m,chl:clamp(B.chl*g*s*j(),.5,150),tp:B.tp*g*(.9+.2*Math.sqrt(mm.p/mp))*j(),tn:B.tn*g*j(),sd:clamp(B.sd/Math.sqrt(g*s)*j(),.2,6),cod:B.cod*g*j()}})}});
 analyse()}
const WT=[.2663,.1879,.179,.1834,.1834];
const tliV=v=>{const a=[10*(2.5+1.086*ln(v.chl)),10*(9.436+1.624*ln(v.tp)),10*(5.453+1.694*ln(v.tn)),10*(5.118-1.94*ln(v.sd)),10*(.109+2.661*ln(v.cod))];a.push(a.reduce((s,x,i)=>s+x*WT[i],0));return a};
const cl=x=>x<30?[0,'#2e86de']:x<50?[1,'#27ae60']:x<60?[2,'#d4a017']:x<70?[3,'#e67e22']:[4,'#c0392b'];
function analyse(){STN.forEach(s=>{const m={};['chl','tp','tn','sd','cod'].forEach(k=>m[k]=mean(s.ser.map(v=>v[k])));s.m=m;s.tl=tliV(m);s.k=cl(s.tl[5]);s.np=m.tn/m.tp;
 const tot=Math.max(.3,m.chl*.35),sc=clamp((s.tl[5]-30)/55,.05,.7)*clamp((TW-14)/12,.4,1.15),di=Math.max(.08,.45-(s.tl[5]-30)/90)*(TW<22?1.3:1),sh=[sc,0,di,.07,.06];sh[1]=Math.max(.05,1-sum(sh));const z=sum(sh);s.sh=sh.map(x=>x/z);s.cd=s.sh.map(x=>+(x*tot).toFixed(2))})}
/* ---------- render ---------- */
function mk(id,cfg){if(CH[id])CH[id].destroy();Chart.defaults.color='#8fb0ba';Chart.defaults.maintainAspectRatio=false;Chart.defaults.borderColor='rgba(255,255,255,.08)';CH[id]=new Chart(id,cfg)}
const pill=(txt,c)=>`<span class="pill" style="background:${c}">${txt}</span>`;
function render(){if(!STN.length)return;const d=DATA.daily,M=monthly(),L=STN.map(s=>s.n),tl=STN.map(s=>s.tl[5]),res=mean(tl),k=cl(res),np=mean(STN.map(s=>s.np)),hi=d.risk.filter(x=>x>=60).length,pk=M.reduce((a,b)=>b.r>a.r?b:a,M[0]);
 $('ban').textContent=(MEAS?t('banM'):t('ban'))+' '+(MEAS?'':t(LOC.src=='osm'?'shoreOK':LOC.src=='img'?'imgOK':'shoreNo')+' '+t('drag'));
 $('kpi').innerHTML=[[t('kT'),res.toFixed(1)+' · '+t('classes')[k[0]]],[t('kC'),mean(STN.map(s=>s.m.chl)).toFixed(1)],[t('kN'),mean(STN.map(s=>s.m.tn)).toFixed(2)+' / '+(mean(STN.map(s=>s.m.tp))*1000).toFixed(0)+' µg/L'],[t('kR'),np.toFixed(0)+' · '+t('lim')[np>29?0:np<10?2:1]],[t('kA'),mean(d.temp).toFixed(1)],[t('kD'),hi],[t('kM'),pk.m+' ('+pk.r.toFixed(0)+')'],[t('kP'),sum(d.precip).toFixed(0)]].map(x=>`<div class="glass kpi"><span>${x[0]}</span><b style="font-size:1.35rem">${x[1]}</b></div>`).join('');
 if(!MAP){MAP=LF.map('map');LF.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Esri'}).addTo(MAP);LY=LF.layerGroup().addTo(MAP)}
 LY.clearLayers();if(POLY)LF.polygon(POLY,{color:'#38bdf8',weight:2,fillOpacity:.15}).addTo(LY);
 STN.forEach(s=>{const pop=()=>`<b>${s.n}</b><br>${s.la.toFixed(5)}, ${s.lo.toFixed(5)}<br>TLI(Σ) ${s.tl[5].toFixed(1)} – ${t('classes')[s.k[0]]}<br>Chl-a ${s.m.chl.toFixed(1)} · TP ${(s.m.tp*1000).toFixed(0)} µg/L · TN ${s.m.tn.toFixed(2)} mg/L`;
  const ic=LF.divIcon({className:'',html:`<div style="width:22px;height:22px;border-radius:50%;background:${s.k[1]};border:3px solid #fff;box-shadow:0 0 6px #000a"></div>`,iconSize:[22,22],iconAnchor:[11,11]});
  const mm=LF.marker([s.la,s.lo],{icon:ic,draggable:true}).addTo(LY).bindTooltip(s.n,{permanent:true,direction:'right',offset:[12,0]}).bindPopup(pop);
  mm.on('dragend',e=>{const p=e.target.getLatLng();s.la=p.lat;s.lo=p.lng})});
 MAP.fitBounds(STN.map(s=>[s.la,s.lo]),{padding:[40,40],maxZoom:15});setTimeout(()=>MAP.invalidateSize(),250);
 mk('cTLI',{type:'bar',data:{labels:L,datasets:[{label:'TLI(Σ)',data:tl.map(x=>+x.toFixed(1)),backgroundColor:STN.map(s=>s.k[1])}]},options:{plugins:{legend:{display:false}},scales:{y:{min:20}}}});
 mk('cRad',{type:'radar',data:{labels:['Chl-a','TP','TN','SD','CODMn'],datasets:STN.map((s,i)=>({label:s.n,data:s.tl.slice(0,5).map(x=>+x.toFixed(1)),borderColor:COL[i],backgroundColor:COL[i]+'22'}))},options:{scales:{r:{min:20,grid:{color:'rgba(255,255,255,.1)'},angleLines:{color:'rgba(255,255,255,.1)'}}}}});
 $('tcls').innerHTML=`<tr><th>${t('st')}</th><th>Chl</th><th>TP</th><th>TN</th><th>SD</th><th>COD</th><th>TLI(Σ)</th><th>${t('state')}</th></tr>`+STN.map(s=>`<tr><td>${s.n}</td>${s.tl.slice(0,5).map(x=>`<td>${x.toFixed(1)}</td>`).join('')}<td><b>${s.tl[5].toFixed(1)}</b></td><td>${pill(t('classes')[s.k[0]],s.k[1])}</td></tr>`).join('');
 mk('cChl',{type:'line',data:{labels:STN[0].ser.map((v,i)=>MEAS?'':v.lab),datasets:STN.map((s,i)=>({label:s.n,data:s.ser.map(v=>+v.chl.toFixed(1)),borderColor:COL[i],tension:.35,pointRadius:3}))}});
 mk('cNut',{type:'bar',data:{labels:L,datasets:[{label:'TN (mg/L)',data:STN.map(s=>+s.m.tn.toFixed(2)),backgroundColor:'#38bdf8'},{label:'TP (×10 mg/L)',data:STN.map(s=>+(s.m.tp*10).toFixed(2)),backgroundColor:'#f59e0b'}]}});
 mk('cNP',{type:'bar',data:{labels:L,datasets:[{label:'TN:TP',data:STN.map(s=>+s.np.toFixed(1)),backgroundColor:'#a78bfa'}]},options:{plugins:{legend:{display:false}}}});
 mk('cRat',{type:'bar',data:{labels:L,datasets:[{label:'Chl-a : TP (µg/µg)',data:STN.map(s=>+(s.m.chl/(s.m.tp*1000)).toFixed(3)),backgroundColor:'#2dd4bf'},{label:'COD : TN',data:STN.map(s=>+(s.m.cod/s.m.tn).toFixed(2)),backgroundColor:'#f472b6'},{label:'COD : TP',data:STN.map(s=>+(s.m.cod/s.m.tp).toFixed(1)),backgroundColor:'#fbbf24'}]},options:{scales:{y:{type:'logarithmic'}}}});
 mk('cSc',{type:'scatter',data:{datasets:STN.map((s,i)=>({label:s.n,data:s.ser.map(v=>({x:+(v.tp*1000).toFixed(1),y:+v.chl.toFixed(1)})),backgroundColor:COL[i]}))},options:{scales:{x:{title:{display:true,text:'TP µg/L'}},y:{title:{display:true,text:'Chl-a µg/L'}}}}});
 $('tmean').innerHTML=`<tr><th>${t('st')}</th><th>Chl µg/L</th><th>TP µg/L</th><th>TN mg/L</th><th>SD m</th><th>COD mg/L</th><th>TN:TP</th></tr>`+STN.map(s=>`<tr><td>${s.n}</td><td>${s.m.chl.toFixed(1)}</td><td>${(s.m.tp*1000).toFixed(0)}</td><td>${s.m.tn.toFixed(2)}</td><td>${s.m.sd.toFixed(2)}</td><td>${s.m.cod.toFixed(1)}</td><td>${s.np.toFixed(0)}</td></tr>`).join('');
 mk('cPhy',{type:'bar',data:{labels:L,datasets:t('G').map((g,j)=>({label:g,data:STN.map(s=>s.cd[j]),backgroundColor:GC[j]}))},options:{scales:{x:{stacked:true},y:{stacked:true}}}});
 const avg=t('G').map((_,j)=>mean(STN.map(s=>s.sh[j])));
 mk('cPie',{type:'doughnut',data:{labels:t('G'),datasets:[{data:avg.map(x=>+(x*100).toFixed(1)),backgroundColor:GC}]},options:{plugins:{legend:{position:'right'}}}});
 $('tsp').innerHTML=`<tr>${t('tax').map(h=>`<th>${h}</th>`).join('')}</tr>`+TAXA.map(x=>{const a=avg[x[1]],ri=a>.3?0:a>.12?1:2;return`<tr><td><i>${x[0]}</i></td><td>${pill(t('G')[x[1]],GC[x[1]])}</td><td>${LG=='en'?x[2]:x[3]}</td><td>${t('rel')[ri]} (${(a*100).toFixed(0)}%)</td></tr>`}).join('');
 mk('c1',{data:{labels:M.map(x=>x.m),datasets:[{type:'bar',label:t('risk'),data:M.map(x=>+x.r.toFixed(1)),backgroundColor:M.map(x=>x.r>=60?'#ef4444':x.r>=40?'#f59e0b':'#2dd4bf'),yAxisID:'y'},{type:'line',label:t('tmp')+' °C',data:M.map(x=>+x.t.toFixed(1)),borderColor:'#38bdf8',yAxisID:'y1',tension:.3}]},options:{scales:{y:{min:0,max:100},y1:{position:'right',grid:{drawOnChartArea:false}}}}});
 mk('c2',{data:{labels:M.map(x=>x.m),datasets:[{type:'bar',label:t('rain')+' mm',data:M.map(x=>+x.p.toFixed(0)),backgroundColor:'#38bdf8aa'},{type:'line',label:'m/s',data:M.map(x=>+x.w.toFixed(1)),borderColor:'#a78bfa',yAxisID:'y1',tension:.3}]},options:{scales:{y1:{position:'right',grid:{drawOnChartArea:false}}}}});
 const ph=x=>x.t>=25&&x.r>=50?[t('c'),'#ef4444']:x.t>=15?[t('g'),'#84cc16']:[t('d'),'#c68b3c'];
 $('tm').innerHTML=`<tr><th>${t('mo')}</th><th>${t('tm')}</th><th>${t('pr')}</th><th>${t('wi')}</th><th>${t('ri')}</th><th>${t('ph')}</th></tr>`+M.map(x=>{const p=ph(x);return`<tr><td>${x.m}</td><td>${x.t.toFixed(1)}</td><td>${x.p.toFixed(0)}</td><td>${x.w.toFixed(1)}</td><td>${x.r.toFixed(0)}</td><td>${pill(p[0],p[1])}</td></tr>`}).join('');
 const hiS=tl.indexOf(Math.max(...tl)),loS=tl.indexOf(Math.min(...tl));
 $('txt').innerHTML=LG=='en'?`<p>${DATA.place}: mean TLI(Σ) <b>${res.toFixed(1)}</b> (${t('classes')[k[0]]}). Condition ranges from ${STN[loS].n} (${tl[loS].toFixed(1)}) to ${STN[hiS].n} (${tl[hiS].toFixed(1)}). Mean TN:TP is ${np.toFixed(0)} – ${t('lim')[np>29?0:np<10?2:1]}. Peak bloom-risk month: <b>${pk.m}</b>; ${hi} days exceeded risk 60. Warm-season air temperature averages ${TW.toFixed(1)} °C, so cyanobacteria share is expected at ~${(avg[0]*100).toFixed(0)}%.</p><p><b>Management focus:</b> reduce external P (agriculture, sewage, rain-driven runoff) before the warm season, watch calm-weather windows, and confirm with field sampling.</p>`:`<p>${DATA.place}：平均 TLI(Σ) <b>${res.toFixed(1)}</b>（${t('classes')[k[0]]}）。各站点 TLI 介于 ${STN[loS].n}（${tl[loS].toFixed(1)}）至 ${STN[hiS].n}（${tl[hiS].toFixed(1)}）。平均 TN:TP 为 ${np.toFixed(0)}，${t('lim')[np>29?0:np<10?2:1]}。藻华风险峰值月份：<b>${pk.m}</b>，共 ${hi} 天风险指数超过 60。暖季平均气温 ${TW.toFixed(1)} °C，预计蓝藻占比约 ${(avg[0]*100).toFixed(0)}%。</p><p><b>管理重点：</b>暖季前削减外源磷（农业、污水、降雨径流），关注静风天气窗口，并以现场采样验证。</p>`}
